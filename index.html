<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>対戦曲ルーレット</title>
  <style>
    :root {
      --c1: #2563eb;
      --c2: #dc2626;
      --c3: #d97706;
      --c4: #7c3aed;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #aaa;
      letter-spacing: 0.06em;
      margin-bottom: 36px;
    }

    /* ── tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #f2f2f2;
      border-radius: 10px;
      margin-bottom: 24px;
    }

    .tab {
      background: transparent;
      border: none;
      border-radius: 7px;
      color: #888;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 22px;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .tab.active {
      background: #fff;
      color: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .tab:hover:not(.active):not(:disabled) {
      color: #555;
      background: #e8e8e8;
    }

    .tab:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── slots ── */
    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 32px;
    }

    .slot {
      --acc: #ddd;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      padding: 18px 18px 16px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      transition: border-color 0.35s, background 0.35s;
    }

    .slot[data-round="0"] { --acc: var(--c1); }
    .slot[data-round="1"] { --acc: var(--c2); }
    .slot[data-round="2"] { --acc: var(--c3); }
    .slot[data-round="3"] { --acc: var(--c4); }

    .slot.spinning {
      border-color: #ccc;
    }

    .slot.settled {
      border-color: var(--acc);
      background: color-mix(in srgb, var(--acc) 4%, #fff);
      animation: pop 0.3s cubic-bezier(.34,1.3,.64,1) both;
    }

    @keyframes pop {
      from { transform: scale(0.97); }
      to   { transform: scale(1); }
    }

    .round-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: #bbb;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .slot.settled .round-label { color: var(--acc); }

    .song-name {
      font-size: clamp(0.88rem, 2.4vw, 1.05rem);
      font-weight: 700;
      color: #ccc;
      line-height: 1.45;
      word-break: break-all;
      transition: color 0.2s;
    }

    .slot.spinning .song-name { color: #444; }
    .slot.settled  .song-name { color: #111; }

    /* ── draw button ── */
    .btn-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #111;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 15px 60px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { background: #333; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .meta {
      font-size: 0.73rem;
      color: #bbb;
      cursor: pointer;
      text-decoration: underline dotted #ccc;
    }

    .meta:hover { color: #888; }

    /* ── modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      width: min(420px, 90vw);
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #aaa;
      line-height: 1;
      padding: 2px 6px;
    }

    .modal-close:hover { color: #555; }

    .modal-body {
      overflow-y: auto;
      padding: 12px 20px 20px;
    }

    .modal-body ol {
      padding-left: 1.6em;
      line-height: 2;
      font-size: 0.85rem;
      color: #222;
    }

    @media (max-width: 480px) {
      .slots { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>対戦曲ルーレット</h1>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="selectList(0)">リスト 1</button>
    <button class="tab"        onclick="selectList(1)">リスト 2</button>
    <button class="tab"        onclick="selectList(2)">リスト 3</button>
  </div>

  <div class="slots">
    <div class="slot" data-round="0" id="slot-0">
      <div class="round-label">1st Stage</div>
      <div class="song-name" id="song-0">—</div>
    </div>
    <div class="slot" data-round="1" id="slot-1">
      <div class="round-label">2nd Stage</div>
      <div class="song-name" id="song-1">—</div>
    </div>
    <div class="slot" data-round="2" id="slot-2">
      <div class="round-label">3rd Stage</div>
      <div class="song-name" id="song-2">—</div>
    </div>
    <div class="slot" data-round="3" id="slot-3">
      <div class="round-label">Final Stage</div>
      <div class="song-name" id="song-3">—</div>
    </div>
  </div>

  <div class="btn-area">
    <button class="btn" id="draw-btn" onclick="draw()">DRAW</button>
    <span class="meta" id="meta" onclick="openModal()"></span>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <ol id="modal-list"></ol>
      </div>
    </div>
  </div>

  <script>
    // =================================================================
    //  曲リスト — 各リストに対戦で使う曲を追加してください
    //  name: タブに表示されるラベル名
    // =================================================================
    const SONG_LISTS = [
      {
        name: "リスト 1",
        songs: [
          "Carmina",
          "Don't believe the hype",
          "EBONY & IVORY [L]",
          "Elemental Creation",
          "EMERALDAS",
          "Glitch N Ride",
          "GO OVER WITH GLARE -ROOTAGE 26-",
          "Ignis†Irae",
          "Inferno of Fomalhaut",
          "LOCUS OF THE TRAVEL",
          "reunion",
          "SCREW // owo // SCREW",
          "Timepiece phase II (CN Ver.)",
          "TITANS RETURN [L]",
          "VANESSA [L]",
          "焔極OVERKILL",
          "真 地獄超特急 -HELL or HELL-",
          "表裏一体！？怪盗いいんちょの悩み [L]",
          "#The_Relentless [L]",
          "Ambivalent Vermilia",
          "Bad Encryption",
          "BroGamer [L]",
          "Chrono Diver -PENDULUMs-",
          "Cult Invitation",
          "Everlasting Message",
          "KAISER PHOENIX [L]",
          "Level 3",
          "LOUDER ROLLING THUNDER",
          "MEGAERA",
          "perditus†paradisus",
          "Phoenix [L]",
          "Reflux",
          "Saturn [L]",
          "Sigmund",
          "Snake Stick",
          "TRANOID [L]",
          "VOX UP",
          "Vulnerability",
          "スキッテイエェエエェ!!!!",
          "ピアノ協奏曲第１番\"蠍火\"",
          "Do it!! Do it!! [L]",
        ],
      },
      {
        name: "リスト 2",
        songs: [
          "EROICA",
          "Miracle 5ympho X [L]",
          "n/a",
          "ディスコルディア",
          "卑弥呼",
          "疾風迅雷 [L]",
          "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [L]",
          "DIAVOLO",
          "Fascination MAXX",
          "Go Beyond!!",
          "Plan 8",
          "The Limbo [L]",
          "Thor's Hammer",
          "WHA",
          "Y&Co. is dead or alive",
          "紫陽花 -AZISAI- [L]",
          "GiGaGaHell",
          "Level 4",
          "Sigmund [L]",
          "THE PEERLESS UNDER HEAVEN",
          "Time to Air [L]",
          "VØID",
          "烽火連天の刃 [L]",
          "駅猫のワルツ",
          "CODE:0 [L]",
          "Dances with Snow Fairies [L]",
          "Go Ahead!!",
          "hard-wired",
          "KAMAITACHI [L]",
          "Level One",
          "Lords Of The Roundtable",
          "Red. by Jack Trance",
          "SOLAR ECLIPSE",
          "The Chase",
          "TOMAHAWK",
          "Verflucht [L]",
          "Xerulean",
          "カジノファイヤーことみちゃん [L]",
          "ピアノ独奏無言歌 \"灰燼\"",
          "3y3s",
          "ZED [L]",
        ],
      },
      {
        name: "リスト 3",
        songs: [
          "ICARUS [L]",
          "SAMURAI-Scramble [L]",
          "X-DEN",
          "Mare Nectaris",
          "Beyond Evolution",
          "Skratch Education Lv-1",
          "RAGE feat.H14 of LEONAIR",
          "Sinus Iridum",
          "Somnidiscotheque",
          "SμG@R RU$#",
          "XHRONOXAPSULΞ",
          "冥",
          "惑星鉄道",
          "GuNGNiR [L]",
          "Illegal Function Call [L]",
          "Level 5",
          "恋愛＝精度×認識力",
          "灼熱 Pt.2 Long Train Running",
          "灼熱Beach Side Bunny",
          "Dans la nuit de l'eternite",
          "THE BLACK KNIGHT [L]",
        ],
      },
    ];
    // =================================================================

    const NUM_PICKS = 4;
    let currentListIndex = 0;
    let isRunning = false;

    const allTabs = document.querySelectorAll('.tab');

    function currentSongs() {
      return SONG_LISTS[currentListIndex].songs;
    }

    function updateMeta() {
      const list = SONG_LISTS[currentListIndex];
      document.getElementById('meta').textContent =
        `${list.name} · 候補曲 ${list.songs.length} 曲`;
    }

    function updateTabLabels() {
      SONG_LISTS.forEach((list, i) => { allTabs[i].textContent = list.name; });
    }

    function resetSlots() {
      for (let i = 0; i < NUM_PICKS; i++) {
        document.getElementById(`slot-${i}`).classList.remove('settled', 'spinning');
        document.getElementById(`song-${i}`).textContent = '—';
      }
    }

    function selectList(index) {
      if (isRunning) return;
      currentListIndex = index;
      allTabs.forEach((t, i) => t.classList.toggle('active', i === index));
      resetSlots();
      updateMeta();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function draw() {
      if (isRunning) return;
      const songs = currentSongs();
      if (songs.length < NUM_PICKS) {
        alert(`曲数が ${NUM_PICKS} 曲以上必要です（現在: ${songs.length} 曲）`);
        return;
      }

      isRunning = true;
      document.getElementById('draw-btn').disabled = true;
      allTabs.forEach(t => t.disabled = true);

      resetSlots();
      const picks = shuffle(songs).slice(0, NUM_PICKS);

      picks.forEach((pick, i) => {
        const slot   = document.getElementById(`slot-${i}`);
        const songEl = document.getElementById(`song-${i}`);
        const startAt = i * 700;
        const spinFor = 1400 + i * 500;

        setTimeout(() => {
          slot.classList.add('spinning');

          const ticker = setInterval(() => {
            songEl.textContent = songs[Math.floor(Math.random() * songs.length)];
          }, 70);

          setTimeout(() => {
            clearInterval(ticker);
            let slowTicks = 6;
            const slowTicker = setInterval(() => {
              songEl.textContent = songs[Math.floor(Math.random() * songs.length)];
              if (--slowTicks <= 0) {
                clearInterval(slowTicker);
                slot.classList.remove('spinning');
                songEl.textContent = pick;
                slot.classList.add('settled');

                if (i === NUM_PICKS - 1) {
                  isRunning = false;
                  document.getElementById('draw-btn').disabled = false;
                  allTabs.forEach(t => t.disabled = false);
                }
              }
            }, 150);
          }, spinFor);
        }, startAt);
      });
    }

    function openModal() {
      const list = SONG_LISTS[currentListIndex];
      document.getElementById('modal-title').textContent =
        `${list.name} · ${list.songs.length} 曲`;
      const ol = document.getElementById('modal-list');
      ol.innerHTML = list.songs.map(s => `<li>${s}</li>`).join('');
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function closeModalOutside(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    updateTabLabels();
    updateMeta();
  </script>
</body>
</html>
